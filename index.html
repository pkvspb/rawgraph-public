<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IaiGraph — Raw Fluorescence Viewer</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./example.css">
</head>
<body>
    <!--
        IaiGraph requires the specific element IDs below.
        You control all sizing and positioning through CSS.
        The library reads container dimensions via getBoundingClientRect()
        and paints into the <canvas> elements automatically.
    -->

    <!-- Resizable left panel — drag the splitter to resize the graph's container -->
    <div class="left" id="left-id"></div>
    <div class="left-resizer" id="left-resizer-id"></div>

    <!-- Zoom controls: any two clickable elements with these IDs -->
    <div class="zoom-controls">
        <button id="rawzoom-out-id">−</button>
        <button id="rawzoom-in-id">+</button>
    </div>

    <!-- X-axis time labels — drawn on canvas by the library -->
    <div class="x-axis-container" id="raw-x-axis-container-id">
        <canvas id="raw-x-axis-id"></canvas>
    </div>

    <!-- Y-axis min/max labels — positioned by the library, sized by the graph container -->
    <div class="y-axis-container">
        <span id="raw-y-axis-max-id"></span>
        <span id="raw-y-axis-min-id"></span>
    </div>

    <!-- Main graph canvas — the library fills this to its container's size -->
    <div class="graph-container" id="rawgraph-container-id">
        <canvas id="rawgraph-id"></canvas>
    </div>

    <!-- Horizontal scroll bar — appears after the first zoom-in -->
    <div class="scroll-container" id="rawscroll-container-id">
        <canvas id="rawscroll-id"></canvas>
    </div>

    <script type="module" src="./example.js"></script>
</body>
</html>
